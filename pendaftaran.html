
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran - Coding Academy</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="gallery.html" class="logo">Coding<span>Academy</span></a>
            <div class="nav-links">
                <a href="gallery.html">Gallery</a>
                <a href="pendaftaran.html" class="active">Pendaftaran</a>
            </div>
        </nav>
    </header>

    <main class="registration-container">
        <div class="section-heading">
            <p class="label">GABUNG BERSAMA KAMI</p>
            <h1>Formulir Pendaftaran</h1>
            <p>Lengkapi data diri Anda untuk mengikuti pelatihan Coding Academy.</p>
        </div>

        <form id="formPendaftaran">

            <div class="form-group">
                <label for="nik">NIK</label>
                <input
                    type="text"
                    id="nik"
                    name="nik"
                    inputmode="numeric"
                    pattern="[0-9]{16}"
                    maxlength="16"
                    placeholder="Masukkan 16 digit NIK"
                    title="NIK harus terdiri dari 16 digit angka"
                    required>
            </div>

            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input
                    type="text"
                    id="nama"
                    name="nama"
                    placeholder="Masukkan nama lengkap"
                    required>
            </div>

            <div class="form-group">
                <label>Jenis Kelamin</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="jenisKelamin"
                            value="Laki-laki" required>
                        Laki-laki
                    </label>

                    <label>
                        <input type="radio" name="jenisKelamin"
                            value="Perempuan">
                        Perempuan
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="nohp">Nomor HP</label>
                <input
                    type="tel"
                    id="nohp"
                    name="nohp"
                    inputmode="numeric"
                    pattern="[0-9+ -]{10,16}"
                    placeholder="Contoh: 081234567890"
                    required>
            </div>

            <div class="form-group">
                <label for="alamat">Alamat</label>
                <textarea
                    id="alamat"
                    name="alamat"
                    rows="4"
                    placeholder="Masukkan alamat lengkap"
                    required></textarea>
            </div>

            <div class="form-group">
                <label for="bahasa">Bahasa Pemrograman yang Diminati</label>
                <select id="bahasa" name="bahasa" required>
                    <option value="">-- Pilih Bahasa Pemrograman --</option>
                    <option value="HTML dan CSS">HTML dan CSS</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Python">Python</option>
                    <option value="Java">Java</option>
                    <option value="C++">C++</option>
                    <option value="PHP">PHP</option>
                </select>
            </div>

            <button type="submit" class="btn submit-btn">
                Simpan Pendaftaran
            </button>

            <a href="gallery.html" class="back-link">
                Kembali ke Gallery
            </a>

        </form>

        <section id="hasilPendaftaran" class="result-box" hidden>
            <h2>Hasil Pendaftaran</h2>
            <p class="success-text">
                Data pendaftaran berhasil dikonfirmasi.
            </p>

            <div id="detailPendaftaran"></div>

            <button type="button" id="btnEdit" class="btn secondary-btn">
                Kembali ke Formulir
            </button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Coding Academy. Belajar Coding untuk Masa Depan.</p>
    </footer>

</body>
</html>
